[project]
name = "aivideo-vm-agent"
version = "0.1.0"
description = "Private HTTP bridge between Django, Ollama and remote MCP tools"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp==4.0.3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "jsonschema>=4,<5",
    "Pillow>=11,<13",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
