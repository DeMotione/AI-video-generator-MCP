limit_req_zone $binary_remote_addr zone=aivideo_health:1m rate=2r/s;
server {
    listen 80;
    server_name @PUBLIC_HOST@;
    client_max_body_size 12m;
    access_log /var/log/nginx/aivideo-access.log;
    error_log /var/log/nginx/aivideo-error.log;
    location /static/ {
        alias @DEPLOY_ROOT@/current/AiVideoGenerator/staticfiles/;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }
    # No media alias: Django enforces the logged-in owner of private videos.
    location ~ ^/(healthz|readyz)/$ {
        limit_req zone=aivideo_health burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
