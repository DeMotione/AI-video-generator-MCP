[project]
name = "aivideo-vm-mcp"
version = "0.1.0"
description = "Always-on FastMCP video tools with prepared demonstration backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp==4.0.3",
    "httpx>=0.28,<0.29",
    "Pillow>=11,<13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
