{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Your private image-to-video creative studio.">
    <title>{% block title %}AiVideoGenerator · Studio{% endblock %}</title>
    <link rel="icon" href="{% static 'mark.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/studio.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
