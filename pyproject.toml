[project]
name = "ai-video-generator"
version = "0.1.0"
description = "MCP server for AI video generation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp==4.0.3",
    "httpx",
    "Pillow",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed into the environment, so the root has to be on
# sys.path for `import video_mcp` to resolve.
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
